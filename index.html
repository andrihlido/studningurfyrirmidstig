<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stuðningur fyrir miðstig</title>
<link rel="stylesheet" href="sameiginlegt.css">
<style>
.hero{display:flex;flex-direction:column;gap:8px;margin:8px 0 22px}
.hero p{font-size:20px;max-width:720px}
.quick{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.quick a{display:flex;flex-direction:column;gap:2px;flex:1 1 240px;max-width:380px;border:1.5px solid var(--line);border-left-width:6px;border-radius:14px;padding:14px 18px;color:var(--ink);text-decoration:none}
.quick a.hugtok{background:var(--hu-bg);border-color:var(--hu-line);border-left-color:var(--hu-acc)}
.quick a.utskyring{background:var(--vs-bg);border-color:var(--vs-line);border-left-color:var(--vs-acc)}
.quick a:hover{filter:brightness(.98);box-shadow:0 2px 8px rgba(31,42,68,.08)}
.quick b{font-size:19px}
.quick span{color:var(--muted);font-size:16px}

.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filter{font:inherit;font-weight:700;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.filter .dot{width:12px;height:12px;border-radius:50%}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.search{font:inherit;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);flex:1 1 220px;max-width:360px}

.listihaus{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 12px}
.litaskyring{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.litaskyring span{display:inline-flex;align-items:center;gap:6px}
.litaskyring i{width:12px;height:12px;border-radius:50%}
.btn-texti{font:inherit;font-weight:700;font-size:15px;background:none;border:0;color:var(--acc-dark);cursor:pointer;min-height:44px;padding:0 4px}

/* Kaflar sem opnast og lokast */
details.kafli{background:var(--card);border:1.5px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
details.kafli[open]{border-color:var(--acc-line)}
details.kafli summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;min-height:64px}
details.kafli summary::-webkit-details-marker{display:none}
details.kafli summary:hover{background:var(--soft)}
details.kafli summary:focus-visible{outline:3px solid #2563EB;outline-offset:-3px}
.knr{flex:none;width:44px;height:44px;border-radius:12px;background:var(--acc);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
.kafli-texti{flex:1;min-width:0}
.kafli-texti h2{margin:0;font-size:22px}
.kafli-texti p{color:var(--muted);font-size:15px}
.ord{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ord span{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.ord .utskyring{background:var(--vs-tag);color:var(--vs-ink)}
.ord .adferd{background:var(--ad-tag);color:var(--ad-ink)}
.ord .aefingaprof{background:var(--ap-tag);color:var(--ap-ink)}
.ord .prof{background:var(--pr-tag);color:var(--pr-ink)}
.ord .hugtok{background:var(--hu-tag);color:var(--hu-ink)}
.or{flex:none;width:28px;height:28px;transition:transform .2s ease;color:var(--muted)}
details.kafli[open] .or{transform:rotate(180deg)}
.kafli-efni{padding:4px 20px 20px}
.dalkar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.dalkar.einn{grid-template-columns:minmax(0,1fr)}
.dalkur h3{margin:0 0 10px;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.atridi{display:flex;flex-direction:column;gap:10px}

/* Efni, litað eftir tegund */
.item{display:flex;flex-direction:column;gap:3px;border:1.5px solid var(--line);border-left-width:6px;border-radius:12px;padding:12px 14px;color:var(--ink);text-decoration:none}
.item:hover{box-shadow:0 2px 8px rgba(31,42,68,.1)}
.item .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item b{font-size:18px}
.item .lys{color:var(--muted);font-size:15px}
.mk{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;letter-spacing:.02em}
.framvinda{font-size:13px;font-weight:700;color:#14532D;background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:999px;padding:1px 9px;margin-left:auto}
.item.utskyring{background:var(--vs-bg);border-color:var(--vs-line);border-left-color:var(--vs-acc)}
.item.utskyring .mk{background:var(--vs-tag);color:var(--vs-ink)}
.item.hugtok{background:var(--hu-bg);border-color:var(--hu-line);border-left-color:var(--hu-acc)}
.item.hugtok .mk{background:var(--hu-tag);color:var(--hu-ink)}
.item.adferd{background:var(--ad-bg);border-color:var(--ad-line);border-left-color:var(--ad-acc)}
.item.adferd .mk{background:var(--ad-tag);color:var(--ad-ink)}
.item.aefingaprof{background:var(--ap-bg);border-color:var(--ap-line);border-left-color:var(--ap-acc)}
.item.aefingaprof .mk{background:var(--ap-tag);color:var(--ap-ink)}
.item.prof{background:var(--pr-bg);border-color:var(--pr-line);border-left-color:var(--pr-acc)}
.item.prof .mk{background:var(--pr-tag);color:var(--pr-ink)}
.tomt{color:var(--muted);background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:18px 20px}
@media (max-width:760px){ .dalkar{grid-template-columns:minmax(0,1fr)} .hero p{font-size:18px} details.kafli summary{padding:14px 14px} .kafli-efni{padding:4px 14px 16px} }
</style>
</head>
<body class="fag-staerdfraedi">
<div class="wrap">
  <header class="hero">
    <h1>Stuðningur fyrir miðstig</h1>
    <p class="muted">Stærðfræði eftir köflum í Stiku 3a. Skildu aðferðirnar á veggspjöldunum, æfðu þær skref fyrir skref og taktu svo æfingapróf úr kaflanum.</p>
  </header>

  <nav class="quick" aria-label="Flýtileiðir">
    <a class="hugtok" href="staerdfraedi/hugtakasafn.html"><b>Hugtakasafn</b><span>Orð og hugtök með dæmi og mynd</span></a>
    <a class="utskyring" href="staerdfraedi/veggspjald.html"><b>Öll veggspjöld</b><span>Aðferðir skref fyrir skref</span></a>
  </nav>

  <div class="tools">
    <div class="row" id="filters" role="group" aria-label="Velja tegund"></div>
    <label for="search" class="sr-only">Leita</label>
    <input class="search" id="search" type="search" placeholder="Leita, t.d. deiling" autocomplete="off">
  </div>

  <div class="listihaus">
    <div class="litaskyring" aria-label="Litaskýring">
      <span><i style="background:var(--vs-acc)"></i>Veggspjald</span>
      <span><i style="background:var(--hu-acc)"></i>Hugtök</span>
      <span><i style="background:var(--ad-acc)"></i>Aðferð</span>
      <span><i style="background:var(--ap-acc)"></i>Æfingapróf</span>
      <span><i style="background:var(--pr-acc)"></i>Kaflapróf</span>
    </div>
    <button class="btn-texti" type="button" id="btnAllir">Opna alla kafla</button>
  </div>

  <main id="list"></main>
</div>

<script src="efni.js"></script>
<script>
(function(){
  "use strict";
  var FLOKKAR = window.FLOKKAR || [], EFNI = window.EFNI || [];
  /* Heitin passa við dálkana í hverjum kafla: Skilja (veggspjöld og hugtök) og Æfa (aðferðir, æfingapróf og kaflapróf) */
  var TEG = [{id:"allt", heiti:"Allt"}, {id:"utskyring", heiti:"Skilja"}, {id:"aefa", heiti:"Æfa"}];
  var LYKILL = "studningur-opnir-kaflar";
  var state = {teg: "allt", leit: "", opnir: lesa()};

  /* Hvaða kaflar eru opnir er geymt í vafranum (aðeins til þæginda) */
  function lesa(){ try { return JSON.parse(localStorage.getItem(LYKILL)) || []; } catch(e){ return []; } }
  function vista(){ try { localStorage.setItem(LYKILL, JSON.stringify(state.opnir)); } catch(e){} }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; });
  }
  function fjoldi(n, et, ft){ return n + " " + (n % 10 === 1 && n % 100 !== 11 ? et : ft); }

  function renderFilters(){
    var box = document.getElementById("filters"); box.innerHTML = "";
    TEG.forEach(function(f){
      var b = document.createElement("button"); b.type = "button"; b.className = "filter";
      b.innerHTML = (f.lit ? "<span class=\"dot\" style=\"background:" + f.lit + "\"></span>" : "") + f.heiti;
      b.setAttribute("aria-pressed", String(state.teg === f.id));
      b.addEventListener("click", function(){ state.teg = f.id; renderFilters(); renderList(); });
      box.appendChild(b);
    });
  }
  function passar(x){
    if(!state.leit) return true;
    return (x.titill + " " + x.lysing + " " + (x.flokkur || "")).toLowerCase().indexOf(state.leit) !== -1;
  }
  /* Framvinda úr aðferðunum og æfingaprófunum (vistuð í vafranum af leikjarammi.js) */
  var FRAMVINDA = (function(){ try { return JSON.parse(localStorage.getItem("studningur-framvinda")) || {}; } catch(e){ return {}; } })();
  function framvinda(slod, teg){
    var id = slod.split("/").pop().replace(/\.html.*$/, ""), f = FRAMVINDA[id];
    if(!f) return "";
    if(teg === "prof") return f.kaflaprof ? "<span class=\"framvinda\">Besti árangur: " + f.kaflaprof.an + " af " + f.kaflaprof.alls + "</span>" : "";
    var n = Object.keys(f).filter(function(k){ return k !== "_efni" && k !== "kaflaprof"; }).length;
    if(!n) return "";
    return "<span class=\"framvinda\">" + (n >= f._efni ? "✓ Öllum efnum lokið" : "✓ " + n + " af " + f._efni + " efnum lokið") + "</span>";
  }
  function item(x, teg, heiti){
    return "<a class=\"item " + teg + "\" href=\"" + esc(x.slod) + "\"><span class=\"t\"><span class=\"mk\">" + heiti + "</span><b>" + esc(x.titill) + "</b>" +
           (teg !== "utskyring" && teg !== "hugtok" ? framvinda(x.slod, teg) : "") + "</span>" +
           "<span class=\"lys\">" + esc(x.lysing) + "</span></a>";
  }
  var OR = "<svg class=\"or\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>";

  function renderList(){
    var html = "", syndir = [];
    FLOKKAR.forEach(function(f){
      /* Æfa: fyrst aðferðir, svo æfingaprófið og síðast æfing fyrir kaflapróf */
      var skilja = [], adferdir = [], aefingaprof = [], profin = [], nV = 0, nA = 0, nP = 0, prof = false;
      EFNI.forEach(function(e){
        if(e.flokkar.indexOf(f.id) === -1) return;
        var x = {titill:e.titill, lysing:e.lysing, slod:e.slod, flokkur:f.heiti};
        if(e.tegund === "utskyring"){ nV++; if(passar(x)) skilja.push(item(x, "utskyring", "Veggspjald")); }
        else if(e.tegund === "adferd"){ nA++; if(passar(x)) adferdir.push(item(x, "adferd", "Aðferð")); }
        else {
          nP++;
          if(passar(x)) aefingaprof.push(item(x, "aefingaprof", "Æfingapróf"));
          if(e.kaflaprof){
            prof = true;
            var p = {titill:"Æfing fyrir kaflapróf", lysing:"Spurningar úr öllum efnum kaflans, án upprifjunar.", slod:e.slod + "#kaflaprof", flokkur:f.heiti + " próf"};
            if(passar(p)) profin.push(item(p, "prof", "Kaflapróf"));
          }
        }
      });
      var aefa = adferdir.concat(aefingaprof, profin);
      var h = {titill:"Hugtök úr kaflanum", lysing:"Orðin í " + f.kafli + ". kafla með skýringu, dæmi og mynd.", slod:"staerdfraedi/hugtakasafn.html#kafli-" + f.kafli, flokkur:f.heiti + " hugtök"};
      if(passar(h)) skilja.push(item(h, "hugtok", "Hugtök"));
      var synaS = state.teg !== "aefa" && skilja.length, synaA = state.teg !== "utskyring" && aefa.length;
      if(!synaS && !synaA) return;
      syndir.push(f.id);
      var opinn = state.leit ? true : state.opnir.indexOf(f.id) !== -1;
      var ord = (nV ? "<span class=\"utskyring\">" + fjoldi(nV, "veggspjald", "veggspjöld") + "</span>" : "") +
                (nA ? "<span class=\"adferd\">" + fjoldi(nA, "aðferð", "aðferðir") + "</span>" : "") +
                (nP ? "<span class=\"aefingaprof\">Æfingapróf</span>" : "") +
                (prof ? "<span class=\"prof\">Kaflapróf</span>" : "") + "<span class=\"hugtok\">Hugtök</span>";
      html += "<details class=\"kafli\" data-id=\"" + f.id + "\"" + (opinn ? " open" : "") + "><summary>" +
              "<span class=\"knr\" aria-hidden=\"true\">" + f.kafli + "</span><span class=\"kafli-texti\"><h2>" + esc(f.heiti) + "</h2>" +
              "<p>Stika 3a · " + f.kafli + ". kafli</p><span class=\"ord\">" + ord + "</span></span>" + OR + "</summary>" +
              "<div class=\"kafli-efni\"><div class=\"dalkar" + (synaS && synaA ? "" : " einn") + "\">" +
              (synaS ? "<div class=\"dalkur\"><h3>Skilja</h3><div class=\"atridi\">" + skilja.join("") + "</div></div>" : "") +
              (synaA ? "<div class=\"dalkur\"><h3>Æfa</h3><div class=\"atridi\">" + aefa.join("") + "</div></div>" : "") +
              "</div></div></details>";
    });
    var list = document.getElementById("list");
    list.innerHTML = html || "<p class=\"tomt\">Ekkert fannst. Prófaðu annað leitarorð.</p>";
    list.querySelectorAll("details.kafli").forEach(function(d){
      d.addEventListener("toggle", function(){
        if(state.leit) return;                       /* Við leit eru allir kaflar opnir; það breytir ekki vistuðu vali */
        var id = d.getAttribute("data-id"), i = state.opnir.indexOf(id);
        if(d.open && i === -1) state.opnir.push(id);
        if(!d.open && i !== -1) state.opnir.splice(i, 1);
        vista(); uppfaeraHnapp();
      });
    });
    state.syndir = syndir;
    uppfaeraHnapp();
  }
  function allirOpnir(){ return (state.syndir || []).length && state.syndir.every(function(id){ return state.opnir.indexOf(id) !== -1; }); }
  function uppfaeraHnapp(){
    var b = document.getElementById("btnAllir");
    b.hidden = !!state.leit;
    b.textContent = allirOpnir() ? "Loka öllum köflum" : "Opna alla kafla";
  }
  document.getElementById("btnAllir").addEventListener("click", function(){
    state.opnir = allirOpnir() ? [] : FLOKKAR.map(function(f){ return f.id; });
    vista(); renderList();
  });
  document.getElementById("search").addEventListener("input", function(e){ state.leit = e.target.value.trim().toLowerCase(); renderList(); });
  renderFilters();
  renderList();
})();
</script>
</body>
</html>
