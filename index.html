<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stuðningur fyrir miðstig</title>
<link rel="stylesheet" href="sameiginlegt.css">
<style>
.hero{display:flex;flex-direction:column;gap:6px;margin:8px 0 24px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:28px}
.filter{font:inherit;font-weight:700;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.search{font:inherit;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);flex:1 1 220px;max-width:360px}
.fag{margin-bottom:32px}
.fag-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dot{width:14px;height:14px;border-radius:4px;background:var(--acc);flex:none}
.fag-head h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:10px;min-height:170px;background:var(--card);border:1.5px solid var(--line);border-top:6px solid var(--acc);border-radius:16px;padding:18px 20px;color:var(--ink);text-decoration:none}
.tile:hover{border-color:var(--acc)}
.tag{align-self:flex-start;background:var(--acc-bg);color:var(--acc-dark);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.tile h3{margin:0;font-size:21px;line-height:1.25}
.tile p{color:var(--muted);font-size:16px}
.open{margin-top:auto;color:var(--acc-dark);font-weight:700}
.empty{color:var(--muted);background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:18px 20px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Stuðningur fyrir miðstig</h1>
    <p class="muted">Æfingar og leikir í kjarnafögum.</p>
  </header>

  <div class="tools">
    <div class="row" id="filters" role="group" aria-label="Velja fag"></div>
    <label for="search" class="sr-only">Leita</label>
    <input class="search" id="search" type="search" placeholder="Leita, t.d. deiling" autocomplete="off">
  </div>

  <main id="list"></main>
</div>

<script src="efni.js"></script>
<script>
(function(){
  "use strict";
  var FOG = window.FOG || [], EFNI = window.EFNI || [];
  var state = { fag: "allt", leit: "" };

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function renderFilters(){
    var opts = [{id:"allt", heiti:"Allt"}].concat(FOG);
    var box = document.getElementById("filters");
    box.innerHTML = "";
    opts.forEach(function(f){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "filter";
      b.textContent = f.heiti;
      b.setAttribute("aria-pressed", String(state.fag === f.id));
      b.addEventListener("click", function(){ state.fag = f.id; renderFilters(); renderList(); });
      box.appendChild(b);
    });
  }

  function matches(e){
    if(!state.leit) return true;
    var t = (e.titill + " " + e.vidfangsefni + " " + e.lysing).toLowerCase();
    return t.indexOf(state.leit) !== -1;
  }

  function renderList(){
    var html = "";
    FOG.forEach(function(f){
      if(state.fag !== "allt" && state.fag !== f.id) return;
      var items = EFNI.filter(function(e){ return e.fag === f.id && matches(e); });
      if(state.leit && items.length === 0) return;
      html += "<section class=\"fag fag-" + esc(f.id) + "\" aria-labelledby=\"h-" + esc(f.id) + "\">";
      html += "<div class=\"fag-head\"><span class=\"dot\" aria-hidden=\"true\"></span><h2 id=\"h-" + esc(f.id) + "\">" + esc(f.heiti) + "</h2></div>";
      if(items.length === 0){
        html += "<p class=\"empty\">Ekkert efni komið enn.</p>";
      } else {
        html += "<div class=\"grid\">";
        items.forEach(function(e){
          html += "<a class=\"tile\" href=\"" + esc(e.slod) + "\">" +
                  "<span class=\"tag\">" + esc(e.vidfangsefni) + "</span>" +
                  "<h3>" + esc(e.titill) + "</h3>" +
                  "<p>" + esc(e.lysing) + "</p>" +
                  "<span class=\"open\">Opna →</span></a>";
        });
        html += "</div>";
      }
      html += "</section>";
    });
    if(!html) html = "<p class=\"empty\">Ekkert fannst. Prófaðu annað leitarorð.</p>";
    document.getElementById("list").innerHTML = html;
  }

  document.getElementById("search").addEventListener("input", function(e){
    state.leit = e.target.value.trim().toLowerCase();
    renderList();
  });

  renderFilters();
  renderList();
})();
</script>
</body>
</html>
