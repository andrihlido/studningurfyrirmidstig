<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stuðningur fyrir miðstig</title>
<link rel="stylesheet" href="sameiginlegt.css">
<style>
.hero{display:flex;flex-direction:column;gap:8px;margin:8px 0 22px}
.hero p{font-size:20px;max-width:720px}
.quick{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.quick a{display:flex;flex-direction:column;gap:2px;flex:1 1 240px;max-width:380px;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--acc);border-radius:14px;padding:14px 18px;color:var(--ink);text-decoration:none}
.quick a:hover{border-color:var(--acc)}
.quick b{font-size:19px}
.quick span{color:var(--muted);font-size:16px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.filter{font:inherit;font-weight:700;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.filter[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.search{font:inherit;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);flex:1 1 220px;max-width:360px}
.flokkur{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:20px}
.flokkur-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.knr{flex:none;width:44px;height:44px;border-radius:12px;background:var(--acc);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
.flokkur-head h2{margin:0;font-size:24px}
.flokkur-head p{color:var(--muted);font-size:15px}
.dalkar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.dalkar.einn{grid-template-columns:minmax(0,1fr)}
.dalkur h3{margin:0 0 10px;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.atridi{display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-direction:column;gap:3px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);text-decoration:none;background:#fff}
.item:hover{border-color:var(--acc);background:var(--acc-bg)}
.item .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item b{font-size:18px}
.item .lys{color:var(--muted);font-size:15px}
.mk{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;letter-spacing:.02em}
.mk.utskyring{background:#E7F0FB;color:#1E4C8A}
.mk.hugtok{background:#EEF0F5;color:#3B4660}
.mk.leikur{background:var(--acc-bg);color:var(--acc-dark)}
.mk.prof{background:#ECFDF3;color:#14532D}
.tomt{color:var(--muted);background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:18px 20px}
@media (max-width:760px){ .dalkar{grid-template-columns:minmax(0,1fr)} .hero p{font-size:18px} }
</style>
</head>
<body class="fag-staerdfraedi">
<div class="wrap">
  <header class="hero">
    <h1>Stuðningur fyrir miðstig</h1>
    <p class="muted">Stærðfræði eftir köflum í Stiku 3a. Skildu aðferðirnar á veggspjöldunum og æfðu þig svo í leikjunum.</p>
  </header>

  <nav class="quick" aria-label="Flýtileiðir">
    <a href="staerdfraedi/hugtakasafn.html"><b>Hugtakasafn</b><span>Orð og hugtök með dæmi og mynd</span></a>
    <a href="staerdfraedi/veggspjald.html"><b>Öll veggspjöld</b><span>Aðferðir skref fyrir skref</span></a>
  </nav>

  <div class="tools">
    <div class="row" id="filters" role="group" aria-label="Velja tegund"></div>
    <label for="search" class="sr-only">Leita</label>
    <input class="search" id="search" type="search" placeholder="Leita, t.d. deiling" autocomplete="off">
  </div>

  <main id="list"></main>
</div>

<script src="efni.js"></script>
<script>
(function(){
  "use strict";
  var FLOKKAR = window.FLOKKAR || [], EFNI = window.EFNI || [];
  var TEG = [{id:"allt", heiti:"Allt"}, {id:"utskyring", heiti:"Útskýringar"}, {id:"leikur", heiti:"Leikir"}];
  var state = {teg: "allt", leit: ""};

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; });
  }
  function renderFilters(){
    var box = document.getElementById("filters"); box.innerHTML = "";
    TEG.forEach(function(f){
      var b = document.createElement("button"); b.type = "button"; b.className = "filter"; b.textContent = f.heiti;
      b.setAttribute("aria-pressed", String(state.teg === f.id));
      b.addEventListener("click", function(){ state.teg = f.id; renderFilters(); renderList(); });
      box.appendChild(b);
    });
  }
  function passar(x){
    if(!state.leit) return true;
    return (x.titill + " " + x.lysing + " " + (x.flokkur || "")).toLowerCase().indexOf(state.leit) !== -1;
  }
  function item(x, mk, mkHeiti){
    return "<a class=\"item\" href=\"" + esc(x.slod) + "\"><span class=\"t\"><span class=\"mk " + mk + "\">" + mkHeiti + "</span><b>" + esc(x.titill) + "</b></span>" +
           "<span class=\"lys\">" + esc(x.lysing) + "</span></a>";
  }
  function renderList(){
    var html = "";
    FLOKKAR.forEach(function(f){
      var skilja = [], aefa = [];
      EFNI.forEach(function(e){
        if(e.flokkar.indexOf(f.id) === -1) return;
        var x = {titill:e.titill, lysing:e.lysing, slod:e.slod, flokkur:f.heiti};
        if(e.tegund === "utskyring"){ if(passar(x)) skilja.push(item(x, "utskyring", "Veggspjald")); }
        else {
          if(passar(x)) aefa.push(item(x, "leikur", "Leikur"));
          if(e.kaflaprof){
            var p = {titill:"Æfing fyrir kaflapróf", lysing:"Spurningar úr öllum efnum kaflans, án upprifjunar.", slod:e.slod + "#kaflaprof", flokkur:f.heiti + " próf"};
            if(passar(p)) aefa.push(item(p, "prof", "Kaflapróf"));
          }
        }
      });
      var h = {titill:"Hugtök úr kaflanum", lysing:"Orðin í " + f.kafli + ". kafla með skýringu, dæmi og mynd.", slod:"staerdfraedi/hugtakasafn.html#kafli-" + f.kafli, flokkur:f.heiti + " hugtök"};
      if(passar(h)) skilja.push(item(h, "hugtok", "Hugtök"));
      var synaS = state.teg !== "leikur" && skilja.length, synaA = state.teg !== "utskyring" && aefa.length;
      if(!synaS && !synaA) return;
      html += "<section class=\"flokkur\" aria-labelledby=\"h-" + f.id + "\"><div class=\"flokkur-head\"><span class=\"knr\" aria-hidden=\"true\">" + f.kafli + "</span>" +
              "<div><h2 id=\"h-" + f.id + "\">" + esc(f.heiti) + "</h2><p>Stika 3a · " + f.kafli + ". kafli</p></div></div>" +
              "<div class=\"dalkar" + (synaS && synaA ? "" : " einn") + "\">" +
              (synaS ? "<div class=\"dalkur\"><h3>Skilja</h3><div class=\"atridi\">" + skilja.join("") + "</div></div>" : "") +
              (synaA ? "<div class=\"dalkur\"><h3>Æfa</h3><div class=\"atridi\">" + aefa.join("") + "</div></div>" : "") +
              "</div></section>";
    });
    document.getElementById("list").innerHTML = html || "<p class=\"tomt\">Ekkert fannst. Prófaðu annað leitarorð.</p>";
  }
  document.getElementById("search").addEventListener("input", function(e){ state.leit = e.target.value.trim().toLowerCase(); renderList(); });
  renderFilters();
  renderList();
})();
</script>
</body>
</html>
